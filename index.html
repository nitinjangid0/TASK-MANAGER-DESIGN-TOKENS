<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Manager — Thiranex Internship Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div>
          <h1>Task Manager</h1>
          <p class="subtitle">Organize your tasks, stay productive.</p>
        </div>
      </div>

      <div class="stats-ring-wrap" aria-live="polite">
        <svg class="stats-ring" width="76" height="76" viewBox="0 0 76 76">
          <circle class="ring-track" cx="38" cy="38" r="32" />
          <circle class="ring-progress" id="ringProgress" cx="38" cy="38" r="32" />
        </svg>
        <span class="ring-label" id="ringLabel">0%</span>
      </div>
    </div>

    <div class="container stats-strip" id="statsStrip">
      <div class="stat-pill">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-name">Total</span>
      </div>
      <div class="stat-pill">
        <span class="stat-value" id="statActive">0</span>
        <span class="stat-name">Active</span>
      </div>
      <div class="stat-pill">
        <span class="stat-value" id="statCompleted">0</span>
        <span class="stat-name">Completed</span>
      </div>
      <div class="stat-pill stat-pill--warn">
        <span class="stat-value" id="statOverdue">0</span>
        <span class="stat-name">Overdue</span>
      </div>
    </div>
  </header>

  <main class="container app-main">

    <!-- ============ ADD TASK ============ -->
    <section class="card add-task-card" aria-labelledby="addTaskHeading">
      <h2 id="addTaskHeading" class="card-heading">Add a new task</h2>
      <form id="taskForm" novalidate>
        <div class="field">
          <label for="taskTitle">Task title</label>
          <input type="text" id="taskTitle" name="taskTitle" placeholder="Enter your task..." autocomplete="off" />
          <span class="field-error" id="titleError" role="alert"></span>
        </div>

        <div class="field">
          <label for="taskDescription">Description <span class="optional">(optional)</span></label>
          <textarea id="taskDescription" name="taskDescription" placeholder="Add a description..." rows="2"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority" name="taskPriority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div class="field">
            <label for="taskDueDate">Due date</label>
            <input type="date" id="taskDueDate" name="taskDueDate" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-add">
          <span aria-hidden="true">+</span> Add Task
        </button>
      </form>
    </section>

    <!-- ============ TOOLBAR: SEARCH / FILTER / SORT ============ -->
    <section class="card toolbar-card" aria-label="Search, filter, and sort tasks">
      <div class="search-field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Search tasks..." aria-label="Search tasks by title or description" />
      </div>

      <div class="toolbar-controls">
        <div class="filter-group" role="group" aria-label="Filter tasks by status">
          <button class="filter-btn is-active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>

        <div class="field field-sort">
          <label for="sortSelect" class="sr-only">Sort by</label>
          <select id="sortSelect" aria-label="Sort tasks">
            <option value="newest">Sort by: Newest</option>
            <option value="oldest">Sort by: Oldest</option>
            <option value="priority">Sort by: Priority</option>
            <option value="dueDate">Sort by: Due date</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ============ TASK LIST ============ -->
    <section aria-labelledby="taskListHeading">
      <h2 id="taskListHeading" class="sr-only">Your tasks</h2>
      <div id="taskList" class="task-list"></div>
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">✓</div>
        <p class="empty-title" id="emptyTitle">No tasks found</p>
        <p class="empty-text" id="emptyText">Add your first task to get started.</p>
      </div>
    </section>
  </main>

  <!-- ============ EDIT MODAL ============ -->
  <div class="modal-overlay" id="editModalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalHeading">
      <div class="modal-header">
        <h2 id="editModalHeading">Edit Task</h2>
        <button class="modal-close" id="editModalClose" type="button" aria-label="Close edit dialog">&times;</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editTaskId" />
        <div class="field">
          <label for="editTitle">Task title</label>
          <input type="text" id="editTitle" />
          <span class="field-error" id="editTitleError" role="alert"></span>
        </div>
        <div class="field">
          <label for="editDescription">Description</label>
          <textarea id="editDescription" rows="2"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="editPriority">Priority</label>
            <select id="editPriority">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div class="field">
            <label for="editDueDate">Due date</label>
            <input type="date" id="editDueDate" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="editCancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ DELETE CONFIRMATION MODAL ============ -->
  <div class="modal-overlay" id="deleteModalOverlay" hidden>
    <div class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="deleteModalHeading">
      <div class="modal-header">
        <h2 id="deleteModalHeading">Delete Task?</h2>
      </div>
      <p class="modal-text">Are you sure you want to delete this task? This can't be undone.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="deleteCancelBtn">Cancel</button>
        <button type="button" class="btn btn-danger" id="deleteConfirmBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast for lightweight feedback -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="index.js"></script>
</body>
</html>
